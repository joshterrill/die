name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  BIN_NAME: die
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TAG"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            exe: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            exe: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            exe: ""
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            exe: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            exe: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            exe: ".exe"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          set -euo pipefail
          archive_name="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "package/${archive_name}" dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.exe }}" "package/${archive_name}/"
          cp README.md "package/${archive_name}/"
          echo "ARCHIVE_NAME=${archive_name}" >> "$GITHUB_ENV"

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C package "${ARCHIVE_NAME}"
          cd dist
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "dist/${env:ARCHIVE_NAME}.zip"
          Compress-Archive -Path "package/${env:ARCHIVE_NAME}" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $file = Split-Path -Leaf $archive
          "$hash  $file" | Set-Content -NoNewline "dist/${env:ARCHIVE_NAME}.zip.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  attach-assets:
    name: Attach release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
